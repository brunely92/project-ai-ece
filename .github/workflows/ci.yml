# C13/C18 — Intégration continue
# Exécute les tests à chaque push et pull request
name: CI Tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate dataset
        run: python -m src.collect.download_dataset

      - name: Clean dataset
        run: python -m src.transform.clean_dataset

      - name: Import to database
        run: python -m src.db.import_data

      - name: Run tests
        env:
          API_SECRET_KEY: test-key
          DATABASE_PATH: data/movies_reviews.sqlite
        run: pytest tests/ -v --tb=short
